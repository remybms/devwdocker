services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: shorty
      POSTGRES_DB: shorty
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "shorty"]
      interval: 5s
      retries: 10
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [back]

  api:
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://shorty:${DB_PASSWORD}@db:5432/shorty
    build: ./api
    networks: [back, front]

  front:
    depends_on:
      - api
    build: ./front
    ports:
      - "8080:80"
    networks: [front]

networks:
  front:
  back: