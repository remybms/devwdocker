services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_USER: shorty
      POSTGRES_DB: shorty
    secrets:
      - db_password
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "shorty"]
      interval: 5s
      retries: 10
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [back]

  api:
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://shorty:${DB_PASSWORD}@db:5432/shorty
    build: ./api
    networks: [back, front]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    image:
      ${DOCKERHUB_USERNAME}/shorty-api:${TAG}

  front:
    depends_on:
      - api
    build: ./front
    ports:
      - "8080:8080"
    networks: [front]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
    image:
      ${DOCKERHUB_USERNAME}/shorty-front:${TAG}

secrets:
  db_password:
    environment: DB_PASSWORD

networks:
  front:
  back: